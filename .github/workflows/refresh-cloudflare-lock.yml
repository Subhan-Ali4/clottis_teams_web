name: Refresh dependency lockfile

on:
  push:
    branches:
      - fix/cloudflare-opennext-preview
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/ci.yml
      - .github/workflows/refresh-cloudflare-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-opennext-preview
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate lockfile from package.json
        run: |
          npm install --package-lock-only --ignore-scripts --include=dev --force
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); for (const n of [...Object.keys(p.dependencies||{}), ...Object.keys(p.devDependencies||{})]) { if (!l.packages['node_modules/'+n]) { console.error('Missing lockfile entry:', n); process.exitCode=1; } }"
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: sync lockfile for Cloudflare deployment"
          git push origin HEAD:fix/cloudflare-opennext-preview
