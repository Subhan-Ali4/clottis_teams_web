name: Refresh dependency lockfile

on:
  push:
    branches:
      - fix/cloudflare-opennext-preview
    paths:
      - package.json
      - .github/workflows/refresh-cloudflare-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-opennext-preview
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package lockfile for Cloudflare"
          git push origin HEAD:fix/cloudflare-opennext-preview
